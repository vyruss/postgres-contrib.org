repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: Scan staged changes for secrets
        entry: ../ve/bin/detect-secrets-hook
        language: system
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^\.secrets\.baseline$
      - id: sanitised-settings
        name: Keep deployment values out of settings.py
        entry: python3 tools/check_settings.py
        language: system
        files: ^pgcontrib/settings\.py$
        pass_filenames: false
