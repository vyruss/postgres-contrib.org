repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^\.secrets\.baseline$

  - repo: local
    hooks:
      - id: sanitised-settings
        name: Keep deployment values out of settings.py
        entry: python3 tools/check_settings.py
        language: system
        files: ^pgcontrib/settings\.py$
        pass_filenames: false
